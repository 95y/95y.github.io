<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">小辣条技术博客封面</title>
  <desc id="desc">由蓝紫渐变、网格和抽象代码窗口组成的技术博客背景</desc>
  <defs>
    <linearGradient id="coverGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.48" stop-color="#172554"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="coverGlowA" cx="0" cy="0" r="1" gradientTransform="translate(350 230) rotate(35) scale(620 460)">
      <stop stop-color="#2563eb" stop-opacity=".8"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coverGlowB" cx="0" cy="0" r="1" gradientTransform="translate(1300 690) rotate(210) scale(540 420)">
      <stop stop-color="#06b6d4" stop-opacity=".42"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="coverGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".07"/>
    </pattern>
    <filter id="coverBlur"><feGaussianBlur stdDeviation="44"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#coverGradient)"/>
  <rect width="1600" height="900" fill="url(#coverGlowA)"/>
  <rect width="1600" height="900" fill="url(#coverGlowB)"/>
  <rect width="1600" height="900" fill="url(#coverGrid)"/>
  <circle cx="1320" cy="180" r="130" fill="#7c3aed" opacity=".18" filter="url(#coverBlur)"/>
  <g transform="translate(1030 250) rotate(-6)" opacity=".78">
    <rect width="420" height="290" rx="28" fill="#0f172a" stroke="#94a3b8" stroke-opacity=".28"/>
    <circle cx="38" cy="34" r="8" fill="#fb7185"/>
    <circle cx="64" cy="34" r="8" fill="#fbbf24"/>
    <circle cx="90" cy="34" r="8" fill="#34d399"/>
    <rect x="36" y="82" width="156" height="14" rx="7" fill="#60a5fa"/>
    <rect x="62" y="119" width="274" height="12" rx="6" fill="#c4b5fd" opacity=".82"/>
    <rect x="62" y="151" width="218" height="12" rx="6" fill="#67e8f9" opacity=".72"/>
    <rect x="36" y="195" width="118" height="14" rx="7" fill="#60a5fa"/>
    <rect x="62" y="231" width="302" height="12" rx="6" fill="#e2e8f0" opacity=".62"/>
  </g>
  <path d="M155 690C330 530 455 750 625 590s300-18 430-132" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity=".38"/>
  <circle cx="155" cy="690" r="8" fill="#38bdf8"/>
  <circle cx="625" cy="590" r="8" fill="#a78bfa"/>
</svg>
