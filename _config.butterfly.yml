# 导航栏
nav:
  logo: /img/avatar.svg
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-user

# 站点图标与头像
favicon: /img/favicon.png
avatar:
  img: /img/avatar.svg
  effect: false

# 首页标题与背景
subtitle:
  enable: true
  effect: true
  typed_option:
  source: false
  sub:
    - 把复杂问题讲清楚，把实践经验沉淀下来
    - 关注前端、工程化、性能与开发效率
    - 保持好奇，持续构建

index_site_info_top: 44%
index_top_img_height: 72vh
index_img: /img/site-cover.svg
default_top_img: /img/site-cover.svg
archive_img: /img/site-cover.svg
tag_img: /img/site-cover.svg
category_img: /img/site-cover.svg
footer_img: false
background:

error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

error_404:
  enable: true
  subtitle: 页面走丢了，返回首页继续阅读吧
  background: /img/site-cover.svg

# 文章封面
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/frontend-performance-cover.svg

index_layout: 3
index_post_content:
  method: 2
  length: 180

# 代码块
code_blocks:
  theme: light
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: true

# 社交链接
social:
  fab fa-github: https://github.com/95y || GitHub
  fas fa-rss: /atom.xml || RSS

theme_color:
  enable: true
  main: "#2563EB"
  paginator: "#7C3AED"
  button_hover: "#7C3AED"
  text_selection: "#2563EB"
  link_color: "#2563EB"
  meta_color: "#64748B"
  hr_color: "#CBD5E1"
  code_foreground: "#0F172A"
  code_background: "rgba(37, 99, 235, 0.08)"
  toc_color: "#2563EB"
  blockquote_padding_color: "#2563EB"
  blockquote_background_color: "rgba(37, 99, 235, 0.08)"
  scrollbar_color: "#2563EB"
  meta_theme_color_light: "#F8FAFC"
  meta_theme_color_dark: "#0B1120"

# 深色模式
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# 侧边栏
aside:
  enable: true
  hide: false
  button: true
  mobile: false
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 前端开发者，记录工程实践、性能优化与效率工具
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/95y
  card_announcement:
    enable: true
    content: 写可复用的经验，做有长期价值的技术积累。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 20
    color: false
    orderby: random
    order: 1
    sort_order:
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
    sort_order:
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    runtime_date: 01/18/2022 00:00:00

# 文章设置
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/95y
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

post_edit:
  enable: true
  url: https://github.com/95y/95y.github.io/edit/main/source/

related_post:
  enable: true
  limit: 4
  date_type: created

noticeOutdate:
  enable: true
  style: flat
  limit_day: 365
  position: top
  message_prev: 距离上次更新已经
  message_next: 天，文中部分内容可能已经发生变化。

# 页面体验
readmode: true
rightside_scroll_percent: true
anchor:
  auto_update: true
  click_to_scroll: true

copy:
  enable: true
  copyright:
    enable: true
    limit_count: 160

lazyload:
  enable: true
  native: true
  field: site
  placeholder:
  blur: false

instantpage: true
translate:
  enable: true
  default: 简
  defaultEncoding: 2
  translateDelay: 0
  msgToTraditionalChinese: 繁
  msgToSimplifiedChinese: 簡

footer:
  owner:
    enable: true
    since: 2022
  custom_text: 基于 Hexo 与 Butterfly 构建
  copyright:
    enable: true
    version: true

# 本地搜索
search:
  use: local_search
  placeholder: 搜索文章、标签或关键词
  local_search:
    preload: true
    top_n_per_article: 3
    unescape: true
    pagination:
      enable: true
      hitsPerPage: 8
    CDN:

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

share:
  use:

comments:
  use:
  text: true
  lazyload: false
  count: false
  card_post_count: false

Open_Graph_meta:
  enable: true
  option:
    twitter_card: summary_large_image

structured_data:
  enable: true
  alternate_name:
    - Chili Hong 的技术博客
    - 95y Blog

inject:
  head:
    - <meta name="color-scheme" content="light dark">
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
