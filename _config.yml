# 站点信息
title: 小辣条
subtitle: 技术、生活与持续折腾
description: 记录开发实践、效率工具和生活思考的个人博客
keywords:
  - 技术博客
  - 前端开发
  - 编程
author: Chili Hong
language: zh-CN
timezone: Asia/Shanghai

# 地址
url: https://95y.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - .nojekyll
include:
  - .nojekyll
exclude:
ignore:

# 写作
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# 日期与分页
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime
per_page: 10
pagination_dir: page
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# 元数据
meta_generator: true

# 主题
theme: butterfly

# 部署：main 保存源码，gh-pages 保存构建产物
deploy:
  type: git
  repo: git@github.com:95y/95y.github.io.git
  branch: gh-pages
  message: Deploy Hexo site
